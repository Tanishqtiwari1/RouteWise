# Render Blueprint: Dashboard → New → Blueprint → select this repository.
# Creates PostgreSQL, the API (Docker) and the website (static), and wires them together.
databases:
  - name: routewise-db
    plan: free            # free Postgres expires after 30 days on Render; upgrade for real use
    databaseName: routewise
    user: routewise

services:
  - type: web
    name: routewise-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ROUTEWISE_ENVIRONMENT
        value: production
      - key: ROUTEWISE_DATABASE_URL
        fromDatabase: { name: routewise-db, property: connectionString }
      - key: ROUTEWISE_ADMIN_TOKEN
        generateValue: true   # copy it from the Render dashboard into the site's key icon
      - key: ROUTEWISE_CORS_ORIGINS
        fromService: { type: web, name: routewise-web, property: host }
      - key: ROUTEWISE_DEMO_SEED     # fill an empty database with the bundled Delhi demo data
        value: "true"
      - key: ROUTEWISE_HOST_SUFFIX   # Render passes short service names; public hosts end with this
        value: .onrender.com
      - key: ROUTEWISE_HTTP_USER_AGENT
        value: RouteWise/1.0 (deployed on Render; set a contact address)

  - type: web
    name: routewise-web
    runtime: static
    rootDir: frontend
    # API_HOST may be a short service name (e.g. routewise-api-v3om); public hosts end in .onrender.com.
    buildCommand: >-
      case "$API_HOST" in *.*) H="$API_HOST" ;; *) H="$API_HOST.onrender.com" ;; esac &&
      npm ci && VITE_API_BASE_URL="https://$H/api/v1" npm run build
    staticPublishPath: dist
    envVars:
      - key: API_HOST
        fromService: { type: web, name: routewise-api, property: host }
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
