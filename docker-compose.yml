# Local full-stack environment: PostgreSQL + API + web (nginx) on http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: routewise
      POSTGRES_USER: routewise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routewise_local_only}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routewise -d routewise"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      ROUTEWISE_DATABASE_URL: postgresql+psycopg://routewise:${POSTGRES_PASSWORD:-routewise_local_only}@db:5432/routewise
      ROUTEWISE_CORS_ORIGINS: http://localhost:8080
      ROUTEWISE_ADMIN_TOKEN: ${ROUTEWISE_ADMIN_TOKEN:-}
      ROUTEWISE_HTTP_USER_AGENT: ${ROUTEWISE_HTTP_USER_AGENT:-RouteWise/1.0 (local docker)}
    volumes: [networkdata:/data]   # cached road-network graphs
    depends_on:
      db: { condition: service_healthy }
    ports: ["8010:8000"]

  web:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  pgdata:
  networkdata:
